<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>주디쌤 본문 퀴즈 · Lesson 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0b1033;--bg2:#1a1350;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);--txt:#eef1ff;--sub:#aab3e6;--gold:#ffd77a;--mint:#5eead4;--violet:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(15px,1.1vw + .5vh,34px)}
body{font-family:"Outfit","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--txt);min-height:100vh;overflow-x:hidden;
background:radial-gradient(1200px 700px at 10% -10%,rgba(94,234,212,.22),transparent 60%),radial-gradient(1000px 700px at 110% 10%,rgba(167,139,250,.28),transparent 60%),radial-gradient(900px 600px at 50% 120%,rgba(255,215,122,.14),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.5px);background-size:120px 120px;opacity:.18}
.wrap{width:100%;min-height:100vh;padding:2vh 3vw 3vh;display:flex;flex-direction:column;position:relative}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:1.6rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
header{display:flex;align-items:center;gap:1.4vw;padding:1.2vh 1.8vw}
header img{width:clamp(80px,13vh,190px);margin:-1vh 0;filter:drop-shadow(0 0 1.4vh rgba(94,234,212,.55)) drop-shadow(0 .8vh 1vh rgba(0,0,0,.4));animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.6vh) rotate(-2deg)}}
header>div{flex:1}
.eyebrow{display:inline-block;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(11px,.95vw,20px);color:var(--mint);border:1px solid rgba(94,234,212,.45);border-radius:999px;padding:.25em .9em;margin-bottom:.5vh}
h1{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:clamp(26px,3.4vw,70px);letter-spacing:-.02em;line-height:1.1;
background:linear-gradient(90deg,#fff 0%,#ffe9b0 40%,#a7f3e4 75%,#c4b5fd 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .3vh .6vh rgba(0,0,0,.35))}
header p{color:var(--sub);font-weight:500;font-size:clamp(13px,1.25vw,26px);margin-top:.4vh}
.fs{border:1px solid var(--line);border-radius:1rem;padding:.7rem 1.1rem;font:700 clamp(13px,1.1vw,22px) "Noto Sans KR",sans-serif;color:var(--txt);cursor:pointer;background:rgba(255,255,255,.08)}
.fs:hover{background:rgba(255,255,255,.16)}
.tabs{display:flex;gap:1vw;margin:2.2vh 0 1.6vh;flex-wrap:wrap}
.tab{flex:1;min-width:150px;border:1px solid var(--line);border-radius:1.1rem;padding:1.2vh 1vw;cursor:pointer;text-align:left;color:var(--sub);background:rgba(255,255,255,.05);transition:.25s;font-family:inherit}
.tab b{display:block;color:var(--txt);font:800 clamp(15px,1.45vw,32px) "Outfit","Noto Sans KR",sans-serif}
.tab span{font-size:clamp(11px,1vw,21px);font-weight:500}
.tab:hover{background:rgba(255,255,255,.1)}
.tab.on{background:linear-gradient(135deg,rgba(94,234,212,.28),rgba(167,139,250,.28));border-color:rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 10px 30px rgba(94,234,212,.2)}
.tab.on span{color:#d9fff8}
.main{flex:1;display:flex;flex-direction:column;gap:2vh}
.left{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 1.4vw;overflow:hidden}
.lvl{position:absolute;top:1.6vh;left:1.4vw;font:800 clamp(14px,1.4vw,30px) "Outfit",sans-serif;letter-spacing:.06em;padding:.3em .9em;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.score{position:absolute;top:1.6vh;right:1.4vw;font:700 clamp(13px,1.2vw,26px) "Outfit",sans-serif;color:var(--sub)}
.score b{color:var(--gold);font-size:1.25em}
.stage{width:100%;height:clamp(240px,34vh,700px);display:flex;align-items:center;justify-content:center}
#gemwrap{height:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;transition:transform .8s cubic-bezier(.34,1.7,.5,1)}
#gem{width:100%;height:100%;overflow:visible;animation:gfloat 4s ease-in-out infinite}
@keyframes gfloat{50%{transform:translateY(-2%)}}
.lvup{animation:lvup .9s cubic-bezier(.3,1.6,.5,1)}@keyframes lvup{0%{transform:scale(.7);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}
.rays{transform-origin:100px 105px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 1.6s ease-in-out infinite}.tw:nth-child(2n){animation-delay:.5s}.tw:nth-child(3n){animation-delay:1s}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.shake{animation:shake .5s}@keyframes shake{20%{transform:translateX(-6%) rotate(-6deg)}60%{transform:translateX(6%) rotate(6deg)}}
.steps{display:flex;gap:.6vw;margin-top:1.6vh;width:100%;justify-content:center}
.steps i{flex:1;max-width:5vw;min-width:28px;height:clamp(8px,1vh,18px);border-radius:999px;background:rgba(255,255,255,.12);transition:.5s}
.steps i.on{background:linear-gradient(90deg,var(--mint),var(--violet),var(--gold));box-shadow:0 0 12px rgba(94,234,212,.6)}
.bar{width:100%;height:clamp(10px,1.4vh,24px);border-radius:999px;background:rgba(255,255,255,.1);margin-top:1.2vh;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--violet));transition:width .6s}
.psgbtn{margin-top:2vh;border:1px solid var(--line);border-radius:999px;padding:.9vh 1.6vw;font:700 clamp(13px,1.2vw,26px) "Noto Sans KR",sans-serif;color:var(--txt);cursor:pointer;background:rgba(255,255,255,.08)}
.psgbtn:hover{background:rgba(255,255,255,.16)}
.card{padding:3.2vh 2.6vw;display:flex;flex-direction:column;justify-content:center}
.qn{align-self:flex-start;font:700 clamp(13px,1.15vw,25px) "Outfit","Noto Sans KR",sans-serif;color:var(--mint);letter-spacing:.06em}
.qn em{font-style:normal;color:var(--sub);margin-left:.6em}
.q{font-family:"Noto Sans KR","Outfit",sans-serif;font-size:clamp(20px,2.5vw,54px);font-weight:700;margin:1.8vh 0 2.8vh;line-height:1.45;word-break:keep-all}
.q small{display:block;font-size:.6em;color:var(--sub);font-weight:500;margin-top:.5em}
.opts{display:grid;grid-template-columns:1fr;gap:1.4vh 1.2vw}
.opt{position:relative;border:1px solid var(--line);border-radius:1.1rem;padding:1.8vh 1.2vw;font:600 clamp(16px,1.85vw,40px) "Outfit","Noto Sans KR",sans-serif;text-align:left;cursor:pointer;color:var(--txt);
background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:0 .5vh 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .15s,background .2s,box-shadow .2s;display:flex;align-items:center;word-break:keep-all}
.opt b{flex:none;display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:.55em;margin-right:.7em;font-size:.78em;color:#0b1033;background:linear-gradient(135deg,#a7f3e4,#c4b5fd)}
.opt:hover:not(:disabled){transform:translateY(-3px);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:0 .8vh 0 rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.3)}
.opt:active:not(:disabled){transform:translateY(.4vh);box-shadow:0 0 0 rgba(0,0,0,.25)}
.opt.ok{background:linear-gradient(135deg,rgba(16,185,129,.55),rgba(94,234,212,.35));border-color:#6ee7b7;box-shadow:0 0 2.4vh rgba(52,211,153,.55)}
.opt.ok b{background:#fff}
.opt.no{background:linear-gradient(135deg,rgba(244,63,94,.5),rgba(251,113,133,.3));border-color:#fda4af}
.opt:disabled{cursor:default}
.foot{display:flex;align-items:center;justify-content:space-between;gap:1vw;margin-top:2.4vh;min-height:6vh}
.msg{font:800 clamp(16px,1.7vw,36px) "Noto Sans KR",sans-serif}
.next{border:0;border-radius:999px;padding:1.3vh 2.4vw;font:800 clamp(16px,1.6vw,34px) "Noto Sans KR",sans-serif;color:#0b1033;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ffb86b);box-shadow:0 .6vh 2vh rgba(255,200,100,.35);visibility:hidden}
.next:hover{filter:brightness(1.08)}
.end{text-align:center}.end h2{font:900 clamp(26px,3.2vw,66px) "Noto Sans KR",sans-serif;margin-bottom:1vh}.end p{font-size:clamp(17px,1.9vw,40px);color:var(--sub)}.end p b{color:var(--gold)}
.end .next{visibility:visible;margin-top:3vh}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,30,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.modal.on{display:flex}
.modal .glass{max-width:1500px;max-height:90vh;overflow:auto;padding:3vh 3vw;background:linear-gradient(180deg,rgba(30,30,80,.92),rgba(20,20,60,.92))}
.psg h3{font:800 clamp(16px,1.5vw,32px) "Outfit","Noto Sans KR",sans-serif;color:var(--mint);margin:1.6vh 0 .6vh}
.psg p{font-size:clamp(16px,1.75vw,38px);line-height:1.7}
.x{float:right;border:1px solid var(--line);border-radius:999px;padding:.3em 1em;font:700 clamp(13px,1.1vw,24px) "Noto Sans KR",sans-serif;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}

/* ===== 주디 전사 & 인벤토리 ===== */
.left{justify-content:flex-start;gap:1.2vh;padding:1.6vh 1.2vw}
.hero{--fr:#b87333;position:relative;width:100%;aspect-ratio:16/10;border-radius:1.2rem;overflow:hidden;border:3px solid var(--fr);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 2vh color-mix(in srgb,var(--fr) 60%,transparent);transition:border-color .6s,box-shadow .6s}
.hero img.w{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block;transition:filter .8s,transform .8s}
.hero.lv0{--fr:#b87333}.hero.lv0 img.w{filter:saturate(.55) brightness(.85)}
.hero.lv1{--fr:#cfd8dc}.hero.lv1 img.w{filter:saturate(.8) brightness(.95)}
.hero.lv2{--fr:#ffd54f}.hero.lv2 img.w{filter:saturate(1.05)}
.hero.lv3{--fr:#4fc3f7;box-shadow:0 0 3vh #4fc3f7}.hero.lv3 img.w{filter:saturate(1.2) contrast(1.05)}
.hero.lv4{border-color:transparent;background:linear-gradient(#000,#000) padding-box,conic-gradient(from var(--a,0deg),#ffd54f,#ff7043,#ec407a,#7e57c2,#29b6f6,#66bb6a,#ffd54f) border-box;animation:rbw 3s linear infinite;box-shadow:0 0 4vh rgba(255,213,79,.7)}
.hero.lv4 img.w{filter:saturate(1.3) contrast(1.08) brightness(1.05)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes rbw{to{--a:360deg}}
.embers{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;background-image:radial-gradient(circle,#ffcc66 0 2px,transparent 3px),radial-gradient(circle,#ff8a3d 0 1.5px,transparent 2.5px);background-size:90px 110px,130px 90px;animation:emb 4s linear infinite}
.hero.lv3 .embers{opacity:.6}.hero.lv4 .embers{opacity:1}
@keyframes emb{to{background-position:0 -220px,40px -180px}}
.hero .lvl{top:1.2vh;left:1vw;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.hero .score{top:1.2vh;right:1vw;background:rgba(0,0,0,.55);padding:.2em .8em;border-radius:999px;color:#fff}
.hero.shake img.w{animation:shake .5s}
.hero.lvup img.w{animation:lvup .9s}@keyframes lvup{0%{transform:scale(1.15);filter:brightness(2)}100%{transform:none}}
.getpop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;background:radial-gradient(circle,rgba(255,215,122,.45),rgba(0,0,0,.55) 70%);opacity:0;pointer-events:none}
.getpop img{width:38%;aspect-ratio:200/190;object-fit:cover;border-radius:1rem;border:3px solid #ffd77a;box-shadow:0 0 3vh #ffd77a}
.getpop b{font:900 clamp(16px,1.8vw,38px) "Noto Sans KR",sans-serif;color:#fff;text-shadow:0 .2vh .6vh #000;background:linear-gradient(90deg,#ff9a3d,#ffd77a);padding:.15em .8em;border-radius:999px;color:#3b1d00}
.getpop.on{animation:getp 1.8s ease forwards}
.getpop.on img{animation:geti 1.8s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes getp{0%{opacity:0}12%,75%{opacity:1}100%{opacity:0}}
@keyframes geti{0%{transform:scale(.2) rotate(-20deg)}30%{transform:scale(1.1) rotate(4deg)}45%,100%{transform:scale(1) rotate(0)}}
.invhead{display:flex;justify-content:space-between;width:100%;font:700 clamp(13px,1.15vw,24px) "Noto Sans KR",sans-serif;color:var(--sub)}
.invhead span:last-child{color:var(--gold)}
.inv{width:100%;display:grid;grid-template-columns:repeat(10,1fr);gap:.45vw}
.slot{aspect-ratio:1;border-radius:.55rem;overflow:hidden;position:relative;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.slot img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.22) blur(1px);opacity:.7;transition:filter .6s,opacity .6s}
.slot:after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(12px,1.1vw,24px) "Outfit",sans-serif;color:rgba(255,255,255,.35)}
.slot.got{border-color:rgba(255,215,122,.7)}.slot.got img{filter:none;opacity:1}.slot.got:after{content:""}
.slot.new{animation:slotnew 1.2s ease;box-shadow:0 0 1.6vh #ffd77a}
@keyframes slotnew{0%{transform:scale(1.6);z-index:2}60%{transform:scale(.95)}100%{transform:none}}
.bar{margin-top:.4vh}.psgbtn{margin-top:.6vh}
@media (min-aspect-ratio:4/3) and (min-width:900px){.wrap{height:100vh}.main{grid-template-columns:minmax(0,42fr) minmax(0,58fr)!important;min-height:0}.left{justify-content:flex-start;min-height:0;overflow:hidden}.hero{flex:1 1 auto;min-height:0;aspect-ratio:auto}.card{min-height:0;overflow:auto}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (min-aspect-ratio:4/3) and (min-width:900px){
 .main{display:grid;grid-template-columns:minmax(0,33fr) minmax(0,67fr);gap:2vw}
 .stage{height:auto;flex:1;min-height:0;max-height:56vh}
 .opts{grid-template-columns:1fr 1fr}
}
</style></head><body>

{title:"Grammar",sub:"접속사 that",text:[["접속사 that","that은 절과 절을 이어 주는 접속사로, '~라는 것'으로 해석해요. that절은 문장에서 명사 역할을 하며 목적어·보어로 쓰여요. 동사 뒤에서 목적어로 쓰인 that은 생략할 수 있어요."],["예문","We know (that) the sun rises in the east. 우리는 태양이 동쪽에서 뜬다는 것을 알고 있다. / Good news is that Bryan finally got a job. 좋은 소식은 Bryan이 마침내 취직했다는 것이다. / I believe (that) Mr. Kim is the best teacher in our school. / We think (that) he is lying."],["본문 속 that","I learned that reusing is important for zero-waste living. / I don't think that the bag looks perfect. / I heard that plastic never goes away completely."]],qs:[
["접속사 that절의 해석으로 알맞은 것은?","~라는 것","~하기 위해","~때문에","~하는 동안"],
["동사 뒤에서 목적어로 쓰인 접속사 that은?","생략할 수 있다","절대 생략할 수 없다","항상 문장 맨 앞에 온다","의문문에서만 쓴다"],
["We know ( ) the sun rises in the east.","that","what","but","or"],
["Good news is ( ) Bryan finally got a job.","that","and","or","who"],
["I believe ( ) Mr. Kim is the best teacher in our school.","that","what","who","or"],
["We think ( ) he is lying.","that","what","where","and"],
["I will have apples ( ) bananas for lunch.<br><small>사과나 바나나</small>","or","that","what","who"],
["I think (important / practice / is).","I think practice is important.","I think important is practice.","I think is practice important.","I think practice important is."],
["I guessed that (was / the right answer / four).","I guessed that the right answer was four.","I guessed that was the right answer four.","I guessed that four the right answer was.","I guessed that the right answer four was."],
["We believe (marry / Mary / that / will / him).","We believe that Mary will marry him.","We believe Mary that will marry him.","We believe that will Mary marry him.","We believe that Mary marry will him."],

["그녀는 그 책이 베스트셀러라고 들었다.","She heard that the book is a bestseller.","She heard the book that is a bestseller.","She that heard the book is a bestseller.","She heard that is the book a bestseller."],

["I learned that reusing is important for zero-waste living.의 해석은?","나는 재사용이 제로 웨이스트 생활에 중요하다는 것을 배웠다.","나는 제로 웨이스트 생활을 재사용하는 법을 배웠다.","재사용은 내가 배운 것 중 가장 중요하다.","나는 제로 웨이스트 생활이 쉽다고 배웠다."],
["I heard that plastic never goes away completely.의 해석은?","나는 플라스틱이 결코 완전히 사라지지 않는다고 들었다.","나는 플라스틱이 곧 완전히 사라진다고 들었다.","나는 플라스틱을 완전히 버렸다.","나는 플라스틱 소리를 들었다."],

function tabs(){$("tabs").innerHTML=DATA.map((r,i)=>`<button class="tab ${i==cur?'on':''}" onclick="start(${i})"><b>${r.title}</b><span>${r.sub} · 24문항</span></button>`).join("")}
function start(r){cur=r;idx=0;score=0;DATA[r].qs.forEach(Q=>{Q.o=shuffle([...Q.o]);Q.a=Q.o.indexOf(Q.ans)});tabs();draw();show();

function level(){const n=DATA[cur].qs.length;return score>=n?4:Math.min(3,Math.floor(score/(n/4)))}

const TH=ITEMS.map((_,k)=>Math.round((k+1)*24/20));
function owned(){return TH.filter(t=>score>=t).length}
function draw(isNew){const n=DATA[cur].qs.length,lv=level(),L=LV[lv],o=owned();
 const hr=$("hero");hr.className="hero lv"+lv;
 $("lvl").textContent=L.n;$("score").innerHTML=`<b>${score}</b> / ${n}`;$("bar").style.width=(score/n*100)+"%";
 $("invcount").textContent=o+" / "+ITEMS.length;
 $("inv").innerHTML=ITEMS.map((it,k)=>`<div class="slot ${k<o?'got':''} ${isNew&&k===o-1?'new':''}" title="${k<o?it.n:'???'}"><img src="${it.img}" alt="${k<o?it.n:'잠긴 아이템'}"></div>`).join("")}
function showGet(k){const g=$("getpop");$("getimg").src=ITEMS[k].img;$("getname").textContent=ITEMS[k].n+" 획득!";g.classList.remove("on");void g.offsetWidth;g.classList.add("on")}
function show(){const R=DATA[cur],n=R.qs.length;
 if(idx>=n){$("card").innerHTML=`<div class="end"><h2>✨ ${R.title} 완료!</h2><p>${n}문항 중 <b>${score}개</b> 정답 · 전사 <b>${LV[level()].n}</b> · 아이템 <b>${owned()}/${ITEMS.length}</b></p><button class="next" onclick="start(cur)">다시 도전하기</button></div>`;if(score>=n*.75)burst(140);return}
 const Q=R.qs[idx];
 $("card").innerHTML=`<span class="qn">${R.title.toUpperCase()} · Q${String(idx+1).padStart(2,"0")}<em>${idx+1} / ${n}</em></span><div class="q">${Q.q}</div>
 <div class="opts">${Q.o.map((o,i)=>`<button class="opt" onclick="pick(this,${i})"><b>${"ABCD"[i]}</b><span>${o}</span></button>`).join("")}</div>
 <div class="foot"><div class="msg" id="msg"></div><button class="next" id="nx" onclick="idx++;show()">다음 문제 →</button></div>`}
function pick(el,i){const Q=DATA[cur].qs[idx],bs=document.querySelectorAll(".opt");bs.forEach(b=>b.disabled=true);bs[Q.a].classList.add("ok");
 if(i===Q.a){const b=level(),ob=owned();score++;const got=owned()>ob;draw(got);const up=level()>b;if(got)showGet(owned()-1);if(up){const g=$("hero");g.classList.remove("lvup");void g.offsetWidth;g.classList.add("lvup")}$("msg").textContent=up?"⬆️ 레벨 업! 전사가 더 강해졌어요!":"✨ 정답!";$("msg").style.color="#6ee7b7";burst(up?120:40)}
 else{el.classList.add("no");$("msg").textContent="다시 확인해 볼까요?";$("msg").style.color="#fda4af";const g=$("hero");g.classList.add("shake");setTimeout(()=>g.classList.remove("shake"),500)}
 $("nx").style.visibility="visible"}
const cv=$("fx"),cx=cv.getContext("2d");let P=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(k){const r=$("hero").getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2,cols=[...LV[level()].c,"#ffd77a","#5eead4","#a78bfa"];
 for(let i=0;i<k;i++){const a=Math.random()*Math.PI*2,v=Math.random()*10+3;P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:Math.random()*9+5,r:Math.random()*6,c:cols[i%cols.length],l:90+Math.random()*40})}
 if(P.length===k)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.vy+=.18;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.beginPath();cx.moveTo(0,-p.s);cx.lineTo(p.s*.6,0);cx.lineTo(0,p.s);cx.lineTo(-p.s*.6,0);cx.closePath();cx.fill();cx.restore()});if(P.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height)}
start(0);
