<style>*{box-sizing:border-box;margin:0}body{min-height:100vh;font-family:"Outfit","Noto Sans KR",sans-serif;color:#eef1ff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 4vw;

header{text-align:center;margin-bottom:5vh}header img{width:clamp(110px,16vh,200px);filter:drop-shadow(0 0 2vh rgba(94,234,212,.5))}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2vw;width:100%;max-width:1500px}
.card{display:flex;flex-direction:column;gap:.6vh;padding:3vh 2vw;border-radius:1.6rem;text-decoration:none;color:inherit;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 50px rgba(0,0,0,.35);transition:.25s}
.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.5);box-shadow:0 24px 60px rgba(94,234,212,.25)}
.ic{font-size:clamp(34px,3.6vw,64px)}.card b{font:800 clamp(22px,2.2vw,42px) "Outfit"}.card em{font-style:normal;color:#5eead4;font-weight:600;font-size:clamp(14px,1.3vw,24px)}.card small{color:#aab3e6;font-size:clamp(12px,1.05vw,20px);font-family:"Noto Sans KR"}
