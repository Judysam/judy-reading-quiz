<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>주디쌤 본문 퀴즈</title>
<style>
:root{--sky:#7cc8dc;--deep:#2f6f86;--pink:#ff8fb7;--ink:#3b2a4a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 15% 10%,#fff6d8 0,transparent 35%),radial-gradient(circle at 85% 20%,#ffe1ef 0,transparent 35%),linear-gradient(160deg,#d9f3fb,#e9e4ff 55%,#ffe6f2);overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#fff,#f2fbff);border-radius:28px;padding:12px 18px;
box-shadow:0 10px 0 #b9e3ee,0 18px 30px rgba(47,111,134,.25),inset 0 -4px 0 #e3f4f9}
header img{width:84px;height:84px;filter:drop-shadow(0 6px 6px rgba(47,111,134,.35));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
header h1{font-size:clamp(22px,5vw,32px);font-weight:900;letter-spacing:-.5px;color:#fff;
-webkit-text-stroke:2px var(--deep);paint-order:stroke fill;text-shadow:0 3px 0 var(--deep),0 6px 10px rgba(0,0,0,.2)}
header p{font-size:14px;color:var(--deep);font-weight:700;margin-top:4px}
.tabs{display:flex;gap:10px;margin:24px 0 8px;flex-wrap:wrap}
.tab{flex:1;min-width:110px;border:0;border-radius:18px;padding:12px;font-size:16px;font-weight:800;cursor:pointer;color:var(--deep);
background:linear-gradient(180deg,#fff,#e8f7fc);box-shadow:0 6px 0 #9fd3e2,0 10px 16px rgba(0,0,0,.12);transition:.12s}
.tab.on{background:linear-gradient(180deg,#9be0f0,#5cb8d0);color:#fff;box-shadow:0 6px 0 #2f8aa6,0 10px 16px rgba(0,0,0,.18)}
.tab:active{transform:translateY(5px);box-shadow:0 1px 0 #2f8aa6}
.stage{position:relative;height:300px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 4px}
#balloon{transform-origin:50% 100%;transition:transform .7s cubic-bezier(.34,1.8,.5,1),filter .6s}
.float{animation:float 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes float{50%{transform:translateY(-10px) rotate(2deg)}}
.wobble{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.lvl{position:absolute;top:6px;right:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px;color:#c2477c;box-shadow:0 4px 0 #f5c2d6}
.bar{height:22px;border-radius:999px;background:#fff;box-shadow:inset 0 3px 6px rgba(0,0,0,.12),0 4px 0 #cfe9f1;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .6s;
background:linear-gradient(90deg,#7cc8dc,#b49cff,#ff8fb7,#ffd36e);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.5)}
.card{background:linear-gradient(180deg,#fff,#fbfdff);border-radius:26px;padding:22px 18px;
box-shadow:0 12px 0 #cfe6ef,0 22px 34px rgba(47,111,134,.22);transform:perspective(800px) rotateX(2deg)}
.qn{display:inline-block;background:linear-gradient(180deg,#ffb3cf,#ff7aa8);color:#fff;font-weight:900;border-radius:12px;padding:4px 12px;box-shadow:0 4px 0 #d9507f;font-size:14px}
.q{font-size:clamp(18px,4.4vw,22px);font-weight:800;margin:14px 0 18px;line-height:1.45;word-break:keep-all}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:0;border-radius:18px;padding:15px 14px;font-size:17px;font-weight:700;text-align:left;cursor:pointer;color:var(--ink);
background:linear-gradient(180deg,#fff,#eef8fc);box-shadow:0 7px 0 #b7dcea,0 12px 18px rgba(0,0,0,.08);transition:transform .1s,box-shadow .1s}
.opt b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;margin-right:8px;background:var(--sky);color:#fff;font-size:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(6px);box-shadow:0 1px 0 #b7dcea}
.opt.ok{background:linear-gradient(180deg,#d6ffe6,#9ef0c0);box-shadow:0 7px 0 #47c07f}
.opt.no{background:linear-gradient(180deg,#ffe0e6,#ffb3c2);box-shadow:0 7px 0 #e06b85}
.opt:disabled{cursor:default}
.next{display:block;margin:20px auto 0;border:0;border-radius:20px;padding:14px 34px;font-size:18px;font-weight:900;color:#fff;cursor:pointer;
background:linear-gradient(180deg,#ffd36e,#ffa940);box-shadow:0 7px 0 #d98420,0 12px 18px rgba(0,0,0,.15);visibility:hidden}
.next:active{transform:translateY(6px);box-shadow:0 1px 0 #d98420}
.msg{text-align:center;font-weight:900;font-size:18px;min-height:26px;margin-top:14px}
.end{text-align:center}.end h2{font-size:28px;margin:6px 0}.end p{font-size:18px;font-weight:700}
.q small{display:block;font-size:15px;color:#7a6a8a;font-weight:600;margin-top:6px}
.psgbtn{display:block;margin:26px auto 0;border:0;border-radius:16px;padding:11px 22px;font-size:15px;font-weight:800;color:var(--deep);cursor:pointer;background:linear-gradient(180deg,#fff,#e8f7fc);box-shadow:0 5px 0 #9fd3e2}
.psgbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #9fd3e2}
.psg{margin-top:14px;background:#fffdf3;border-radius:20px;padding:18px;line-height:1.75;font-size:16px;box-shadow:0 8px 0 #f1e3b5,0 14px 24px rgba(0,0,0,.08)}

/* ===== 전자칠판(큰 화면) 크기 ===== */
html{font-size:clamp(15px,1.15vw + .5vh,34px)}
.wrap{max-width:none;width:100%;min-height:100vh;padding:2vh 3vw 3vh;display:flex;flex-direction:column}
header{padding:1.2vh 1.6vw;gap:1.4vw}
header img{width:clamp(70px,11vh,170px);height:auto}
header h1{font-size:clamp(26px,3.6vw,72px);-webkit-text-stroke:.12em var(--deep)}
header h1{-webkit-text-stroke-width:clamp(2px,.25vw,5px)}
header p{font-size:clamp(14px,1.4vw,28px)}
header>div{flex:1}
.fs{border:0;border-radius:1rem;padding:.7rem 1.1rem;font-size:clamp(14px,1.2vw,24px);font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(180deg,#9be0f0,#5cb8d0);box-shadow:0 .4rem 0 #2f8aa6}
.fs:active{transform:translateY(.35rem);box-shadow:0 1px 0 #2f8aa6}
.tabs{margin:2.4vh 0 1.4vh;gap:1vw}
.tab{font-size:clamp(16px,1.6vw,34px);padding:1.2vh 1vw;border-radius:1.2rem}
.main{flex:1;display:flex;flex-direction:column;gap:2vh}
.stage{height:clamp(240px,34vh,700px)}
#balloon{height:100%;width:auto;display:block}
.float{height:100%}
.lvl{font-size:clamp(14px,1.4vw,30px);padding:.4em 1em}
.bar{height:clamp(18px,2.4vh,40px)}
.card{padding:3vh 2.4vw;border-radius:2rem}
.qn{font-size:clamp(14px,1.3vw,28px);padding:.3em .8em}
.q{font-size:clamp(20px,2.7vw,56px);margin:2.2vh 0 2.8vh;line-height:1.4}
.q small{font-size:.62em;margin-top:.5em}
.opts{gap:1.6vh 1.4vw}
.opt{font-size:clamp(17px,2vw,42px);padding:2vh 1.2vw;border-radius:1.3rem}
.opt b{width:1.6em;height:1.6em;font-size:.8em;margin-right:.5em}
.msg{font-size:clamp(17px,1.9vw,40px);min-height:1.5em;margin-top:2vh}
.next{font-size:clamp(17px,1.8vw,38px);padding:1.4vh 2.4vw;margin-top:2vh;border-radius:1.2rem}
.end h2{font-size:clamp(26px,3.4vw,70px)}.end p{font-size:clamp(18px,2vw,42px)}
.psgbtn{font-size:clamp(15px,1.4vw,30px);padding:1.1vh 1.6vw;margin:2vh auto 0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(40,60,80,.45);display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.modal.on{display:flex}
.modal .psg{margin:0;max-width:1400px;max-height:90vh;overflow:auto;font-size:clamp(17px,2vw,40px);line-height:1.7;padding:3vh 3vw;position:relative}
.modal .x{float:right;border:0;border-radius:1rem;padding:.4em .9em;font-size:.7em;font-weight:900;background:#ffb3cf;color:#fff;cursor:pointer;margin:0 0 .5em 1em}
/* 가로 화면: 왼쪽 풍선 / 오른쪽 문제 */
@media (min-aspect-ratio:4/3) and (min-width:900px){
 .main{display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);gap:2.4vw;align-items:stretch}
 .left{display:flex;flex-direction:column;justify-content:center;background:rgba(255,255,255,.45);border-radius:2rem;padding:2vh 1.4vw;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}
 .stage{height:auto;flex:1;min-height:0;max-height:58vh}
 .card{display:flex;flex-direction:column;justify-content:center;transform:none}
 .opts{grid-template-columns:1fr 1fr}
}
header img{mix-blend-mode:normal;width:clamp(84px,14vh,200px)!important;margin:-1vh 0;filter:drop-shadow(0 .5vh .3vh rgba(47,111,134,.35)) drop-shadow(0 1.2vh 1.6vh rgba(124,200,220,.45))!important;animation:bob 3.5s ease-in-out infinite;transition:transform .4s}
header img:hover{transform:scale(1.08) rotate(-6deg)}
@keyframes bob{50%{transform:translateY(-.6vh) rotate(-2deg)}}
header h1{-webkit-text-stroke-width:clamp(1.5px,.16vw,3px);color:#fff}
.qn{align-self:flex-start}
.card .end{align-self:center}

.stage{position:relative}
.trex{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;pointer-events:none}
.trex.on{display:flex}
.rex-in{position:relative;height:100%;width:100%;display:flex;align-items:flex-end;justify-content:center;opacity:0}
.trex.on .rex-in{animation:rexIn 1s .55s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes rexIn{0%{opacity:0;transform:scale(.2) translateY(30%)}100%{opacity:1;transform:none}}
.rexsvg{position:relative;z-index:1;height:86%;object-fit:contain;width:auto;max-width:100%;overflow:visible;filter:drop-shadow(0 1.2vh 1.4vh rgba(20,80,40,.35))}
.rexshadow{position:absolute;bottom:1%;left:50%;width:70%;height:6%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(0,0,0,.25),transparent 70%)}
.trex.on .rex-img{animation:rexmove 2.2s 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes rexmove{0%,100%{transform:translateY(0) rotate(0) scale(1)}20%{transform:translateY(-4%) rotate(-3deg)}40%{transform:translateY(0) rotate(0) scale(1.06)}55%{transform:scale(1.06) rotate(-2deg)}70%{transform:translateY(-4%) rotate(3deg) scale(1)}}
.trex.on .rex-body{animation:stomp 1.1s 1.6s ease-in-out infinite;transform-origin:150px 260px}
@keyframes stomp{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3%) rotate(-2deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-3%) rotate(2deg)}}
.trex.on .rex-head{animation:head 2.2s 1.6s ease-in-out infinite;transform-origin:205px 120px}
@keyframes head{0%,100%{transform:rotate(0)}40%{transform:rotate(-10deg)}60%{transform:rotate(-10deg)}}
.trex.on .jaw{animation:jaw 2.2s 1.6s ease-in-out infinite;transform-origin:208px 114px}
@keyframes jaw{0%,30%,70%,100%{transform:rotate(0)}40%,60%{transform:rotate(16deg)}}
.trex.on .arm{animation:arm .5s 1.6s ease-in-out infinite alternate;transform-origin:207px 152px}
@keyframes arm{to{transform:rotate(-18deg)}}
.roar{position:absolute;top:0;left:3%;z-index:2;background:#fff;color:#1f7a3a;font-weight:900;font-size:clamp(14px,1.6vw,34px);padding:.15em .6em;border-radius:1em;box-shadow:0 .25em 0 #f3b37a;color:#c2571a;transform:rotate(8deg);opacity:0}
.trex.on .roar{animation:roar 2.2s 1.6s ease-in-out infinite}
@keyframes roar{0%,25%{opacity:0;transform:rotate(8deg) scale(.6)}40%,65%{opacity:1;transform:rotate(8deg) scale(1.1)}85%,100%{opacity:0;transform:rotate(8deg) scale(1)}}
.bang{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(40px,6vw,130px);color:#ff5d8f;-webkit-text-stroke:3px #fff;paint-order:stroke fill;opacity:0;z-index:2}
.trex.on .bang{animation:bang .9s forwards}
@keyframes bang{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.popping{animation:popb .5s ease-in forwards!important}
@keyframes popb{0%{transform:scale(1)}60%{transform:scale(1.45)}100%{transform:scale(1.7);opacity:0}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style></head><body>
<canvas id="fx"></canvas>

const READINGS=RAW.map(r=>({title:r.title,text:r.text,qs:r.qs.map(([q,...o])=>({q,ans:o[0],o}))}));

const STAGES=[
 {name:"Lv.1",c:["#bfe9f5","#7cc8dc"]},
 {name:"Lv.2",c:["#ffd1e3","#ff8fb7"]},

 {name:"Lv.4",c:["#fff3a8","#ff9bd0","#8f7bff","#5cc8e8"],rib:1,star:1},
 {name:"Lv.5",c:["#fff6c2","#ffd36e","#ffa940"],rib:1,star:1,crown:1}];
let cur=0,idx=0,score=0,order=[];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function tabs(){$("tabs").innerHTML=READINGS.map((r,i)=>`<button class="tab ${i==cur?'on':''}" onclick="start(${i})">📖 ${r.title}</button>`).join("")}
function start(r){$("trex").classList.remove("on");const fl=document.querySelector(".float");fl.style.visibility="";fl.classList.remove("popping");cur=r;idx=0;score=0;order=[...READINGS[r].qs.keys()];READINGS[r].qs.forEach(Q=>{Q.o=shuffle([...Q.o]);Q.a=Q.o.indexOf(Q.ans)});tabs();draw();show();$("psg").textContent=READINGS[r].text;$("psgm").classList.remove("on")}
function togglePsg(){$("psgm").classList.toggle("on")}
function fsToggle(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function stage(){const n=READINGS[cur].qs.length;return score>=n?4:Math.min(3,Math.floor(score/(n/4)))}
function draw(){
 const n=READINGS[cur].qs.length,s=STAGES[stage()],sc=.45+.55*(score/n);
 const stops=s.c.map((c,i)=>`<stop offset="${i/(s.c.length-1)*100}%" stop-color="${c}"/>`).join("");
 let x=`<defs><radialGradient id="g" cx="35%" cy="30%" r="75%">${stops}</radialGradient>
 <radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
 <path d="M100 205 q-14 30 6 50 q14 16 -4 35" stroke="#9aa" stroke-width="2" fill="none"/>
 <ellipse cx="100" cy="105" rx="78" ry="95" fill="url(#g)" stroke="rgba(0,0,0,.08)" stroke-width="2"/>
 <ellipse cx="72" cy="62" rx="22" ry="32" fill="url(#sh)" transform="rotate(-25 72 62)"/>
 <path d="M92 198 L108 198 L100 210 Z" fill="${s.c[s.c.length-1]}"/>`;
 if(s.rib)x+=`<path d="M100 207 q-26 6 -30 22 q18 -2 30 -16 q12 14 30 16 q-4 -16 -30 -22" fill="#ff6fa3" stroke="#d9507f" stroke-width="1.5"/>`;
 if(s.star)x+=[[30,40],[170,60],[160,160],[40,150],[100,18]].map(([a,b],i)=>`<text x="${a}" y="${b}" font-size="${14+i%3*5}" text-anchor="middle">✨</text>`).join("");
 if(s.crown)x+=`<text x="100" y="22" font-size="34" text-anchor="middle">👑</text>`;
 const b=$("balloon");b.innerHTML=x;b.style.transform=`scale(${sc})`;
 b.style.filter=stage()>=3?`drop-shadow(0 0 ${8+stage()*6}px rgba(255,200,120,.9))`:"drop-shadow(0 12px 10px rgba(0,0,0,.18))";
 $("lvl").textContent=s.name;$("bar").style.width=(score/n*100)+"%";
}

function show(){

 if(idx>=n){rexShow();$("card").innerHTML=`<div class="end"><h2>🎉 ${R.title} 완료!</h2><p>${n}문항 중 <b style="color:#d9507f">${score}개</b> 정답</p><p style="margin-top:6px">${STAGES[stage()].name}까지 키웠어요! ${REVEAL[cur].msg}</p><button class="next" style="visibility:visible" onclick="start(cur)">다시 도전하기</button></div>`;if(score>=n*.75)boom(160);return}

const cv=$("fx"),cx=cv.getContext("2d");let P=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function boom(k){const cols=["#ff8fb7","#7cc8dc","#ffd36e","#b49cff","#7ee0a8"];for(let i=0;i<k;i++)P.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*8+5,r:Math.random()*6,c:cols[i%5],l:120});if(P.length===k)loop()}
